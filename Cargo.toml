[package]
name = "particle_sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "particle_sim"
path = "src/main.rs"

# Photon laboratory: one photon made of grains (rotate + translate)
[[bin]]
name = "fotone"
path = "src/photon/main.rs"

# Molecules from the electron-ball rule (diffusion Monte Carlo per ball): atoms -> molecules
[[bin]]
name = "molecole"
path = "src/molecole/main.rs"

# One photon meets one helium atom: absorption, sloshing cloud, spontaneous emission (numbers from the balls)
[[bin]]
name = "scontro"
path = "src/scontro/main.rs"

# Compton: one photon hits one free electron at rest (Klein–Nishina input, surfers pick one pair)
[[bin]]
name = "compton"
path = "src/compton/main.rs"

# Zig-zag: one quantum-walk rule (translate at c + rotate) for light, the free electron and hydrogen
[[bin]]
name = "zigzag"
path = "src/zigzag/main.rs"

# Laboratorio Atomo: one carbon atom from the electron-ball rule (fixed-node DMC), zoom down to the proton knot
[[bin]]
name = "atomo"
path = "src/atomo/main.rs"

[dependencies]
bevy      = { version = "0.15" }
bevy_egui = "0.31"
rand      = "0.8"
rayon     = "1"
wgpu      = { version = "23", features = ["wgsl"] }
bytemuck  = { version = "1", features = ["derive"] }
pollster  = "0.3"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
